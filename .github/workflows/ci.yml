name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to main runs this through the publish workflow, where the run is worth finishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        # src/global.json selects the test runner, so the SDK has to resolve it from here.
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore Debarr.sln

      - name: Build
        run: dotnet build Debarr.sln -c Release --no-restore

      # Detection tests that need the fixtures in .dev, and identification tests that need a synced
      # database, skip themselves on the runner.
      - name: Test
        run: dotnet test Debarr.sln -c Release

  image:
    name: Build image
    # The publish workflow builds and pushes the image, so this job covers pull requests only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: src
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
